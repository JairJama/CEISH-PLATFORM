services:
  postgres:
    image: postgres:16-alpine
    container_name: ceish_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-ceish_db}
      POSTGRES_USER: ${DATABASE_USER:-ceish_user}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-ceish_pass}
    ports:
      - "${DATABASE_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Scripts de inicialización: se ejecutan en orden alfabético
      # SOLO la primera vez que se crea el volumen (BD vacía).
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-ceish_user} -d ${DATABASE_NAME:-ceish_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Object storage para los documentos PDF ──────────────────────────────────
  minio:
    image: quay.io/minio/minio:latest
    container_name: ceish_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_PORT:-9000}:9000"        # API S3
      - "${MINIO_CONSOLE_PORT:-9001}:9001" # Consola web
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Init: crea el bucket "documents" una sola vez ───────────────────────────
  minio-init:
    image: quay.io/minio/mc:latest
    container_name: ceish_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin};
      mc mb --ignore-existing local/${MINIO_BUCKET:-documents};
      echo 'Bucket ${MINIO_BUCKET:-documents} listo';
      exit 0;
      "

volumes:
  postgres_data:
    name: ceish_postgres_data
  minio_data:
    name: ceish_minio_data
