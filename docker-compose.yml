services:
  postgres:
    image: postgres:16-alpine
    container_name: ceish_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-ceish_db}
      POSTGRES_USER: ${DATABASE_USER:-ceish_user}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-ceish_pass}
    ports:
      - "${DATABASE_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Scripts de inicialización: se ejecutan en orden alfabético
      # SOLO la primera vez que se crea el volumen (BD vacía).
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-ceish_user} -d ${DATABASE_NAME:-ceish_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Object storage para los documentos PDF ──────────────────────────────────
  minio:
    image: quay.io/minio/minio:latest
    container_name: ceish_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_PORT:-9000}:9000"        # API S3
      - "${MINIO_CONSOLE_PORT:-9001}:9001" # Consola web
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Init: crea el bucket "documents" una sola vez ───────────────────────────
  minio-init:
    image: quay.io/minio/mc:latest
    container_name: ceish_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin};
      mc mb --ignore-existing local/${MINIO_BUCKET:-documents};
      echo 'Bucket ${MINIO_BUCKET:-documents} listo';
      exit 0;
      "

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ceish_backend
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      APP_PORT: 3000
      APP_HOST: 0.0.0.0
      DATABASE_URL: postgresql://${DATABASE_USER:-ceish_user}:${DATABASE_PASSWORD:-ceish_pass}@postgres:5432/${DATABASE_NAME:-ceish_db}?schema=public
      SESSION_SECRET: ${SESSION_SECRET:-ceish-development-secret-change-before-production}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-documents}
      MINIO_USE_SSL: "false"
      UPLOAD_MAX_MB: ${UPLOAD_MAX_MB:-15}
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

volumes:
  postgres_data:
    name: ceish_postgres_data
  minio_data:
    name: ceish_minio_data
